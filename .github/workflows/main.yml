
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build standalone application
        run: dotnet publish InstallerLauncher.csproj -c Release -r win-x64 --self-contained true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InstallerLauncher-windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/InstallerLauncher.exe
